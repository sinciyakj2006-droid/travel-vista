{% extends "base.html" %}

{% block content %}

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="card border-0 shadow-sm rounded-4 text-center p-5">

                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill"
                           style="font-size: 70px; color: #198754;"></i>
                    </div>

                    <h1 class="fw-bold mb-3">
                        Review Submitted Successfully
                    </h1>

                    <p class="text-muted mb-4">
                        Thank you for sharing your travel experience
                        with Travel Vista.
                    </p>

                    <p class="small text-muted mb-4">
                        Your review will be visible after it is approved
                        by our team.
                    </p>

                    <div>
                        <a href="{% url 'home' %}"
                           class="btn btn-primary px-4 rounded-pill">
                            Back to Home
                        </a>

                        <a href="{% url 'customer_review' %}"
                           class="btn btn-outline-primary px-4 rounded-pill ms-2">
                            Write Another Review
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </div>
</section>

{% endblock %}
