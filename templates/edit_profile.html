<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | Travel Vista</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f1ff, #eef8f2);
            font-family: Arial, sans-serif;
        }

        .page-wrapper {
            display: flex;
            justify-content: center;
            padding: 60px 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .profile-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-title h2 {
            color: #6c4ab6;
            font-weight: 700;
        }

        .profile-title p {
            color: #777;
        }

        .form-label {
            font-weight: 600;
            color: #444;
        }

        .form-control {
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .form-control:focus {
            border-color: #6c4ab6;
            box-shadow: 0 0 0 3px rgba(108, 74, 182, 0.12);
        }

        .btn-save {
            background: linear-gradient(135deg, #6c4ab6, #8d6bd1);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
        }

        .btn-save:hover {
            color: white;
            transform: translateY(-1px);
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #6c4ab6;
            font-weight: 600;
        }

        .error-message {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .success-message {
            background: #e5f8eb;
            color: #18743a;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="page-wrapper">

    <div class="profile-card">

        <div class="profile-title">
            <h2>✏️ Edit Profile</h2>
            <p>Update your Travel Vista account details</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'success' %}success-message{% else %}error-message{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    value="{{ user.username }}"
                    required
                    minlength="3"
                >
                <small class="text-muted">
                    Minimum 3 characters. Letters, numbers and underscore only.
                </small>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ user.email }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">First Name</label>
                <input
                    type="text"
                    name="first_name"
                    class="form-control"
                    value="{{ user.first_name }}"
                    placeholder="Enter first name"
                >
            </div>

            <div class="mb-4">
                <label class="form-label">Last Name</label>
                <input
                    type="text"
                    name="last_name"
                    class="form-control"
                    value="{{ user.last_name }}"
                    placeholder="Enter last name"
                >
            </div>

            <button type="submit" class="btn-save">
                💾 Save Changes
            </button>

            <a href="{% url 'profile' %}" class="btn-back">
                ← Back to Profile
            </a>

        </form>

    </div>

</div>

</body>
</html>
