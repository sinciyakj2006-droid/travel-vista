<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logout | Travel Vista</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #f4efff,
                #e9f5ee
            );

            padding: 20px;
        }

        .logout-card {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 40px 35px;

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .logout-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #f1ebff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;
        }

        h1 {
            color: #333;
            margin-bottom: 12px;
            font-size: 27px;
        }

        .username {
            color: #6c4ab6;
            font-weight: 700;
        }

        .message {
            color: #777;
            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 28px;
        }

        .button-container {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button,
        .cancel-btn {
            flex: 1;

            padding: 13px 18px;

            border-radius: 11px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            text-decoration: none;

            transition: 0.25s;
        }

        .logout-btn {
            border: none;

            color: white;

            background: linear-gradient(
                135deg,
                #6c4ab6,
                #8e6bd1
            );
        }

        .logout-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 18px
                rgba(108, 74, 182, 0.3);
        }

        .cancel-btn {
            border: 2px solid #ddd;

            background: white;

            color: #555;
        }

        .cancel-btn:hover {
            border-color: #6c4ab6;
            color: #6c4ab6;
        }

        .small-text {
            margin-top: 22px;

            color: #999;

            font-size: 12px;
        }

        @media (max-width: 450px) {

            .logout-card {
                padding: 32px 22px;
            }

            .button-container {
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

    <div class="logout-card">

        <div class="logout-icon">
            🚪
        </div>

        <h1>
            Logout?
        </h1>

        <p class="message">

            Are you sure you want to logout,
            <span class="username">
                {{ user.username }}
            </span>?

        </p>

        <!-- =====================================================
             LOGOUT FORM
        ====================================================== -->

        <form method="POST">

            {% csrf_token %}

            <div class="button-container">

                <a
                    href="{% url 'home' %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="logout-btn"
                >
                    Yes, Logout
                </button>

            </div>

        </form>

        <div class="small-text">
            You can login again anytime from the Travel Vista website.
        </div>

    </div>

</body>
</html>
