<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | Travel Vista</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f1ff, #eef8f2);
            font-family: Arial, sans-serif;
        }

        .page-wrapper {
            display: flex;
            justify-content: center;
            padding: 60px 20px;
        }

        .password-card {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            color: #6c4ab6;
            font-weight: 700;
        }

        .title p {
            color: #777;
        }

        .form-label {
            font-weight: 600;
            color: #444;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }

        .form-control {
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .form-control:focus {
            border-color: #6c4ab6;
            box-shadow: 0 0 0 3px rgba(108, 74, 182, 0.12);
        }

        .btn-change {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c4ab6, #8d6bd1);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-change:hover {
            opacity: 0.92;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #6c4ab6;
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .success-message {
            background: #e5f8eb;
            color: #18743a;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .password-help {
            font-size: 13px;
            color: #777;
            margin-top: 6px;
        }
    </style>
</head>

<body>

<div class="page-wrapper">

    <div class="password-card">

        <div class="title">
            <h2>Change Password</h2>
            <p>Keep your Travel Vista account secure</p>
        </div>

        {% if error %}
            <div class="error-message">
                 {{ error }}
            </div>
        {% endif %}

        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'success' %}success-message{% else %}error-message{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <!-- Current Password -->
            <div class="mb-4">
                <label class="form-label">Current Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        name="current_password"
                        id="currentPassword"
                        class="form-control"
                        placeholder="Enter current password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-btn"
                        onclick="togglePassword('currentPassword', this)">
                        
                    </button>
                </div>
            </div>


            <!-- New Password -->
            <div class="mb-4">
                <label class="form-label">New Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        name="new_password"
                        id="newPassword"
                        class="form-control"
                        placeholder="Enter new password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="eye-btn"
                        onclick="togglePassword('newPassword', this)">
                        
                    </button>
                </div>

                <div class="password-help">
                    Password must contain at least 8 characters.
                </div>
            </div>


            <!-- Confirm Password -->
            <div class="mb-4">
                <label class="form-label">Confirm New Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        name="confirm_password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Re-enter new password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="eye-btn"
                        onclick="togglePassword('confirmPassword', this)">
                        
                    </button>
                </div>
            </div>


            <button type="submit" class="btn-change">
                 Change Password
            </button>

            <a href="{% url 'profile' %}" class="back-link">
                ← Back to Profile
            </a>

        </form>

    </div>

</div>


<script>
function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "";
    } else {
        input.type = "password";
        button.textContent = "";
    }
}
</script>

</body>
</html>
