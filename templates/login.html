<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Travel Vista</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 15px;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #f4efff,
                #e9f5ee
            );

        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .login-container {

            width: 100%;

            max-width: 460px;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .login-card {

            background: white;

            padding: 40px;

            border-radius: 22px;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.12);

        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            text-align: center;

            font-size: 32px;

            font-weight: 800;

            color: #6c4ab6;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 15px;

            margin-bottom: 30px;

        }


        /* =====================================================
           DJANGO MESSAGES
        ===================================================== */

        .message-box {

            margin-bottom: 20px;

        }


        .message {

            padding: 13px 15px;

            border-radius: 10px;

            margin-bottom: 10px;

            font-size: 14px;

            line-height: 1.4;

        }


        .message.error {

            background: #ffe8e8;

            color: #b42318;

            border: 1px solid #ffcccc;

        }


        .message.success {

            background: #e9f8ef;

            color: #18794e;

            border: 1px solid #c7ecd7;

        }


        .message.info {

            background: #edf4ff;

            color: #245ea8;

            border: 1px solid #cfe0ff;

        }


        /* =====================================================
           FORM GROUP
        ===================================================== */

        .form-group {

            margin-bottom: 22px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: 600;

            font-size: 14px;

        }


        /* =====================================================
           NORMAL INPUT
        ===================================================== */

        input {

            width: 100%;

            padding: 14px 15px;

            border: 1.5px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.25s;

        }


        input:focus {

            border-color: #6c4ab6;

            box-shadow:
                0 0 0 3px
                rgba(108, 74, 182, 0.1);

        }


        /* =====================================================
           PASSWORD WRAPPER
        ===================================================== */

        .password-wrapper {

            position: relative;

            width: 100%;

        }


        .password-wrapper input {

            padding-right: 55px;

        }


        /* =====================================================
           EYE BUTTON
        ===================================================== */

        .password-toggle {

            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            width: 38px;

            height: 38px;

            border: none;

            background: transparent;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 19px;

            border-radius: 50%;

            transition: 0.2s;

        }


        .password-toggle:hover {

            background: #f2edff;

        }


        .password-toggle:focus {

            outline: none;

        }


        /* =====================================================
           FORGOT PASSWORD
        ===================================================== */

        .forgot-password {

            text-align: right;

            margin-top: -10px;

            margin-bottom: 22px;

        }


        .forgot-password a {

            color: #6c4ab6;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;

        }


        .forgot-password a:hover {

            text-decoration: underline;

        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #6c4ab6,
                #8e6bd1
            );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;

        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 7px 18px
                rgba(108, 74, 182, 0.3);

        }


        /* =====================================================
           REGISTER LINK
        ===================================================== */

        .register-link {

            text-align: center;

            margin-top: 24px;

            color: #777;

            font-size: 14px;

        }


        .register-link a {

            color: #6c4ab6;

            font-weight: 700;

            text-decoration: none;

        }


        .register-link a:hover {

            text-decoration: underline;

        }


        /* =====================================================
           HOME LINK
        ===================================================== */

        .back-home {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #777;

            text-decoration: none;

            font-size: 13px;

        }


        .back-home:hover {

            color: #6c4ab6;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .login-card {

                padding: 30px 22px;

            }


            .logo {

                font-size: 28px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <!-- =================================================
             LOGO
        ================================================== -->

        <div class="logo">

             Travel Vista

        </div>


        <div class="subtitle">

            Welcome back! Login to continue your journey 

        </div>



        <!-- =================================================
             DJANGO MESSAGES
        ================================================== -->

        {% if messages %}

            <div class="message-box">

                {% for message in messages %}

                    <div class="message {{ message.tags }}">

                        {{ message }}

                    </div>

                {% endfor %}

            </div>

        {% endif %}



        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form
            method="POST"
            action="{% url 'login' %}"
        >

            {% csrf_token %}



            <!-- USERNAME / EMAIL -->

            <div class="form-group">

                <label for="login_input">

                    Username or Email

                </label>


                <input
                    type="text"
                    id="login_input"
                    name="login_input"
                    placeholder="Enter username or email"
                    value="{{ request.POST.login_input|default:'' }}"
                    autocomplete="username"
                    required
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <div class="password-wrapper">


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >


                    <!-- ALWAYS VISIBLE EYE -->

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                        aria-label="Show or hide password"
                    >

                        <span id="eyeIcon">
                            
                        </span>

                    </button>


                </div>

            </div>



            <!-- FORGOT PASSWORD -->

            <div class="forgot-password">

                <a href="{% url 'password_reset' %}">

                    Forgot Password?

                </a>

            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
            >

                 Login

            </button>


        </form>



        <!-- =================================================
             REGISTER
        ================================================== -->

        <div class="register-link">

            Don't have an account?

            <a href="{% url 'register' %}">

                Register

            </a>

        </div>



        <!-- =================================================
             HOME
        ================================================== -->

        <a
            href="{% url 'home' %}"
            class="back-home"
        >

            ← Back to Home

        </a>


    </div>

</div>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>


function togglePassword() {

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("eyeIcon");


    if (password.type === "password") {

        password.type = "text";

        eye.textContent = "";

    }

    else {

        password.type = "password";

        eye.textContent = "";

    }

}


</script>


</body>

</html>
